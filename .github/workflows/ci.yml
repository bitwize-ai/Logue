name: CI

on:
  push:
    branches: [ "main", "dev" ]
  # Every pull request, whatever it targets. Filtering by base branch meant a PR
  # stacked on another PR's branch got no CI at all — it was reviewed, approved and
  # merged on the strength of a green tick it never had. Pushes stay filtered:
  # a branch with no PR open is someone's work in progress, not a thing to gate.
  pull_request:

# Least privilege: CI only reads the repo. Denies write access to the
# GITHUB_TOKEN for all workflow runs, including those from fork pull requests.
permissions:
  contents: read

jobs:
  lint-check:
    name: Lint Check
    # Pinned for the same reason the tool versions below are: `macos-latest` is an alias
    # GitHub repoints to a new major macOS on its own schedule, which would move this job
    # off the runner the Build job uses without anything in the repo changing. It already
    # had: the alias now serves macOS 26 while Build was pinned to 15.
    #
    # Pinned forward to 26 rather than back to 15, because 26 is what the app targets
    # (`project.yml`: deploymentTarget 26.0, xcodeVersion 26.0) and what this job has
    # been running on in practice. Bump all three `runs-on` pins together and
    # deliberately: this job, Build below, and release.yml.
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned SwiftFormat & SwiftLint
        # Pinned versions keep CI deterministic. Unpinned `brew install` fetches
        # the latest release, which silently enables new default rules and breaks
        # formatting/lint on unchanged code. Bump these deliberately.
        env:
          SWIFTFORMAT_VERSION: "0.62.1"
          SWIFTLINT_VERSION: "0.65.0"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tools"
          curl -fsSL -o /tmp/swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -o /tmp/swiftformat.zip -d /tmp/swiftformat
          cp "$(find /tmp/swiftformat -type f -name swiftformat | head -1)" "$HOME/tools/swiftformat"
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o /tmp/swiftlint.zip -d /tmp/swiftlint
          cp "$(find /tmp/swiftlint -type f -name swiftlint | head -1)" "$HOME/tools/swiftlint"
          chmod +x "$HOME/tools/swiftformat" "$HOME/tools/swiftlint"
          echo "$HOME/tools" >> "$GITHUB_PATH"
          "$HOME/tools/swiftformat" --version
          "$HOME/tools/swiftlint" version

      - name: Run SwiftFormat
        run: swiftformat --lint .
        working-directory: Logue

      - name: Run SwiftLint
        run: swiftlint lint --strict Logue/

      # Runs here rather than in Build: it needs Python and nothing else, and its
      # output is only ever seen after a release is signed, notarised and published.
      - name: Test release-notes extraction
        run: python3 test_extract_release_notes.py
        working-directory: scripts

      # Logue must not be sandboxed: a sandboxed process cannot be an Accessibility
      # API client, so macOS never lists it under Privacy & Security → Accessibility
      # and every Logue/CrossApp feature (⌘⌃I, global hotkeys, Command Center, text
      # replacement) silently stops working. That shipped in 1.0.0 as issue #22.
      # Nothing fails at build time if this regresses, so it is checked explicitly.
      - name: Verify app sandbox stays disabled
        run: |
          rc=0
          for plist in Logue/Resources/Logue.entitlements Logue/Resources/Logue.release.entitlements; do
            value=$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.app-sandbox" "$plist" 2>/dev/null || echo "missing")
            if [ "$value" != "false" ]; then
              echo "::error file=$plist::app-sandbox is '$value', expected 'false' (see issue #22)"
              rc=1
            else
              echo "OK: $plist has app-sandbox = false"
            fi
          done
          exit $rc

  build:
    name: Build
    # One of the three pins — see the Lint Check job above.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project Logue.xcodeproj \
            -scheme Logue \
            -destination 'platform=macOS,arch=arm64' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      # Everything except the suites that need a model, named by exclusion rather than by
      # listing what to run. The allow-list this replaces had to be remembered: a suite not
      # added to it never executed, which is how eleven suites covering task storage and
      # space folders — including the ones written for defects found in review — sat green
      # by never having run. `scripts/test-no-llm.sh` already holds the skip list, and it is
      # the same list a developer runs locally, so the two cannot drift.
      #
      # LogueTests/LLMIntegration drives a real on-device MLX model, which no hosted runner
      # has; those 16 suites are what the script skips.
      - name: Test (everything that needs no model)
        run: ./scripts/test-no-llm.sh
